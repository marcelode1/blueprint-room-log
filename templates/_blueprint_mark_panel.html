{# The part picker in the plan toolbar: choose a part, then click the plan with Pick to mark each one. Admin only. #}
<div class="tbGroup tbStack tbParts" id="partMarkPanel">
    <div class="tbRow">
        <span class="partThumb" id="partActiveThumb" hidden></span>
        <div class="partPickBox">
            <input id="partPickInput" placeholder="Type a part to mark, e.g. load circuit" autocomplete="off" aria-label="Part to mark on the plan">
            <div class="partPickList" id="partPickList" hidden></div>
        </div>
        <span class="partActive" id="partActive" hidden>
            <button type="button" class="tbIcon" id="partSymbolBtn" title="Change this part's symbol picture">
                <svg class="tbSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
            </button>
            <input type="file" id="partSymbolInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            <button type="button" class="tbIcon" id="partStopBtn" title="Stop marking (Esc or right-click the plan)">
                <svg class="tbSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </span>
        <select id="partMarkSize" class="tbSizeSelect" title="Symbol size on the plan" aria-label="Symbol size">
            <option value="18">S</option>
            <option value="28" selected>M</option>
            <option value="42">L</option>
        </select>
        <button type="button" class="tbIcon" id="partUndoBtn" title="Undo the last mark" disabled>
            <svg class="tbSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
        </button>
    </div>
    <span class="tbCaption" id="partActiveName">Mark Parts on the Plan</span>
</div>

<div class="partNewOverlay" id="partNewOverlay" hidden>
    <div class="partNewDialog" role="dialog" aria-labelledby="partNewTitle">
        <h3 id="partNewTitle" style="margin-top:0">New Catalog Item</h3>
        <p class="muted" style="margin-top:0">It is saved to the catalog, so it is there next time too.</p>
        <div class="grid">
            <div><label>Material / Item</label><input id="partNewName"></div>
            <div><label>Brand</label><input id="partNewBrand"></div>
            <div><label>Model Number</label><input id="partNewModel"></div>
            <div><label>Part #</label><input id="partNewPartNumber"></div>
            <div><label>Price</label><input id="partNewPrice" inputmode="decimal" placeholder="0.00"></div>
            <div><label>Time to Install</label><input id="partNewInstall" placeholder="45m, 1h 30m, 2h"></div>
            <div><label>Category</label><input id="partNewCategory" placeholder="Lighting, receptacles, low voltage"></div>
            <div>
                <label>Unit</label>
                <select id="partNewUnit">
                    <option value="UN">UN - Unit</option>
                    <option value="PR">PR - Pair</option>
                </select>
            </div>
        </div>
        <label class="partNewCheck"><input type="checkbox" id="partNewTaxable" checked> Taxable</label>
        <label>Description</label>
        <textarea id="partNewDescription" rows="2" placeholder="What it is, where it is used, anything to remember"></textarea>
        <label>Symbol Picture <span class="muted" style="font-weight:400">(what each mark on the plan looks like)</span></label>
        <div class="partNewSymbolRow">
            <input type="file" id="partNewSymbol" accept="image/png,image/jpeg,image/webp,image/gif">
            <img id="partNewSymbolPreview" alt="" hidden>
        </div>
        <p class="partNewError" id="partNewError" hidden></p>
        <div class="partNewActions">
            <button type="button" id="partNewSaveBtn">Save and Start Marking</button>
            <button type="button" class="btn-secondary" id="partNewCancelBtn">Cancel</button>
        </div>
    </div>
</div>
